<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <script src="js/jquery-4.0.0.min.js"></script>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.css"
      integrity="sha512-x9WwyMYBnlXMNQ6kQ/Lyzu1NqIhLQKL5Oq6xByfXuRj7s9CskyCbLv/1IjqzJmXwFXWr0ov6jBV7Qbc0hh9nHg=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
    <style>
      * {
        margin: 0px;
        padding: 0px;
        box-sizing: border-box;
      }
      a {
        color: inherit;
        text-decoration: none;
      }
      ul {
        list-style: none;
        width: 1000px;
        margin: 50px auto;
        display: flex;
        gap: 20px;
      }
      li {
        background-color: orange;
        width: 200px;
        height: 300px;
        overflow: hidden;
      }
      p {
        position: relative;
        top: 50%;
        right: -200px;
        transform: translateY(-50%);
      }
    </style>
  </head>
  <body>
    <ul>
      <li><p>list1</p></li>
      <li><p>list2</p></li>
      <li><p>list3</p></li>
      <li><p>list4</p></li>
    </ul>
    <script>
      $("li").on("mouseenter", function () {
        $(this).children("p").stop().animate({ right: "-150px" });
      });
      $("li").on("mouseleave", function () {
        $(this).children("p").stop().animate({ right: "-200px" });
      });
    </script>
  </body>
</html>
