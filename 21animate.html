<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <script src="js/jquery-4.0.0.min.js"></script>
    <style>
      * {
        padding: 0px;
        margin: 0px;
      }
      ul {
        list-style: none;
      }
      a {
        color: inherit;
        text-decoration: none;
      }
      div {
        width: 100px;
        height: 100px;
        background-color: orange;
        border: 0px solid red;
      }
    </style>
  </head>
  <body>
    <div>박스</div>
    <button class="btn01">시작</button>
    <button class="btn02">초기화</button>
    <script>
      $(".btn01").on("click", function () {
        $("div").animate(
          {
            width: "200px",
            height: "200px",
            "border-width": "5px",
          },
          2000,
        );
        // $("div").animate({ "background-color": "#000" });
      });
      $(".btn02").on("click", function () {
        $("div").animate({
          width: "100px",
          height: "100px",
          "border-width": "0px",
        });
      });
    </script>
  </body>
</html>
<!--
animate({"":""}) :: css 속성값을 변화 시킴
css + transition을 합친것임
animate는 속성값이 숫자인 경우마 사용 가능
font-size, witdh, height, left, top, opacity

background-color, color, transform에 관련된 것은 다 안됨

한 줄에 한개씩 입력하면 순차적으로 적용이 됨

// $("div").animate({ height: "200px" });
// $("div").animate({ "border-width": "5px" });
