      #wrap02 {
        .front {
          background-color: #fff;
          width: 100%;
          height: 100vh;
          padding: 20px;
          text-align: right;
          display: none;
          position: relative;
          top: 0px;
          left: 0px;
          p {
            display: inline-block;
            border: 1px solid gold;
            color: orange;
            padding: 5px;
            cursor: pointer;
          }
          .txt {
            color: orange;
            text-align: center;
            line-height: 3rem;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
          }
        }
        .back {
          background-color: #000;
          width: 100%;
          height: 100vh;
          padding: 20px;
          text-align: right;
          p {
            display: inline-block;
            border: 1px solid gold;
            color: gold;
            padding: 5px;
            cursor: pointer;
          }
        }
      }
    </style>

    <section id="wrap02">
      <ul>
        <li class="front">
          <p>X</p>
          <div class="txt">
            <h2>창업기</h2>
            <h2>성장기</h2>
            <h2>성숙기</h2>
            <h2>제2의 성장기</h2>
            <h2>오늘의 한진, 매래의 한진</h2>
          </div>
        </li>
        <li class="back"><p>Menu</p></li>
      </ul>
      <script>
        $(".back p").on("click", function () {
          $(".front").slideDown();
          $(".front p").show();
          $(".back").slideUp();
          $(".back p").hide();
          $(".txt").hide();
          $(".txt").slideDown(2000);
        });
        $(".front p").on("click", function () {
          $(".front").slideUp();
          $(".front p").hide();
          $(".back").slideDown();
          $(".back p").show();
        });
      </script>
    </section>
