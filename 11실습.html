<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <script src="js/jquery-4.0.0.min.js"></script>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.css"
      integrity="sha512-x9WwyMYBnlXMNQ6kQ/Lyzu1NqIhLQKL5Oq6xByfXuRj7s9CskyCbLv/1IjqzJmXwFXWr0ov6jBV7Qbc0hh9nHg=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
    <style>
      * {
        margin: 0px;
        padding: 0px;
        box-sizing: border-box;
      }
      a {
        color: inherit;
        text-decoration: none;
      }
      ul {
        list-style: none;
      }
      /* wrap01 */
      .wrap01 {
        width: 400px;
        height: 200px;
        margin: 50px auto;
        border: 1px solid red;
        overflow: hidden;

        img {
          width: 100%;
          transition: 1s;
        }
      }
      .active {
        transform: scale(1.3);
      }
      /* wrap02 */
      .wrap02 {
        width: 400px;
        height: 200px;
        margin: 50px auto;
        overflow: hidden;
        position: relative;
        img {
          width: 100%;
          transition: 1s;
        }
      }
      .txt {
        background-color: rgba(255, 255, 255, 0.3);
        color: #fff;
        padding: 10px;
        width: 80%;
        position: absolute;
        bottom: 10px;
        left: 50%;
        transform: translateX(-50%);
        h2 {
          font-size: 1rem;
        }
        p {
          font-size: 0.8rem;
        }
      }
      .active02 {
        transform: scale(1.3);
      }
      .active03 {
        color: #000;
      }
    </style>
  </head>
  <body>
    <div class="wrap01">
      <img src="img/pic1.jpg" alt="" />
      <script>
        $(".wrap01").on("mouseenter", function () {
          $(".wrap01 img").addClass("active");
        });
        $(".wrap01").on("mouseleave", function () {
          $(".wrap01 img").removeClass("active");
        });
      </script>
    </div>

    <div class="wrap02">
      <img src="img/pic2.jpg" alt="" />
      <div class="txt">
        <h2>Blue Picks</h2>
        <p>꾸준히 사랑받는 쿨한 무드의 컬러</p>
      </div>
      <script>
        $(".wrap02").on("mouseenter", function () {
          $(".wrap02 img").addClass("active02");
          $(".txt").addClass("active03");
        });
        $(".wrap02").on("mouseleave", function () {
          $(".wrap02 img").removeClass("active02");
          $(".txt").removeClass("active03");
        });
      </script>
    </div>
  </body>
</html>
