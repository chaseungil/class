<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <script src="js/jquery-4.0.0.min.js"></script>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.css"
      integrity="sha512-x9WwyMYBnlXMNQ6kQ/Lyzu1NqIhLQKL5Oq6xByfXuRj7s9CskyCbLv/1IjqzJmXwFXWr0ov6jBV7Qbc0hh9nHg=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
    <style>
      * {
        margin: 0px;
        padding: 0px;
        box-sizing: border-box;
      }
      a {
        color: inherit;
        text-decoration: none;
      }
      ul {
        list-style: none;
      }

      div {
        width: 50%;
        height: 100px;
        background-color: #ccc;
        display: none;
        /* opacity: 0; */
      }
    </style>
  </head>
  <body>
    <div>박스</div>
    <button class="btn01">fadeIn</button>
    <button class="btn02">fadeOut</button>
    <button class="btn03">fadeToggle</button>
    <button class="btn04">fadeTo</button>
    <script>
      $(".btn01").on("click", function () {
        $("div").fadeIn(2000);
      });
      $(".btn02").on("click", function () {
        $("div").fadeOut(2000);
      });
      $(".btn03").on("click", function () {
        $("div").fadeToggle(2000);
      });
      $(".btn04").on("click", function () {
        $("div").fadeTo(1000, 0.7);
      });
    </script>
  </body>
</html>
<!--
fade :: 흠림효과 => 서시히 나오거나 서서히 사라짐 (opacity)
$("선택자").on("이벤트", function(){
  $("선택자").fadeIn(속도) :: 서서히 나옴
  $("선택자").fadeOut(속도) :: 서서히 사라짐
  $("선택자").fadeToggle(속도) ::서서히 나오거나 서서히 사라짐
  $("선탲가").fadeTo(속도, 불투명도) :: 불투명도 조절함
});


-->
