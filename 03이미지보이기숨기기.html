<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <script src="js/jquery-4.0.0.min.js"></script>
    <style>
      img {
        display: none;
      }
    </style>
  </head>
  <body>
    <img src="img/pic1.jpg" alt="" />
    <div>
      <button class="btn01">보이기</button>
      <button class="btn02">숨기기</button>
      <button class="btn03">토글</button>
    </div>
    <script>
      $(".btn01").on("click", function () {
        $("img").show();
      });
      $(".btn02").on("click", function () {
        $("img").hide();
      });
      $(".btn03").on("click", function () {
        $("img").toggle();
      });
    </script>
  </body>
</html>
