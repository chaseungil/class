<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <script src="js/jquery-4.0.0.min.js"></script>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.css"
      integrity="sha512-x9WwyMYBnlXMNQ6kQ/Lyzu1NqIhLQKL5Oq6xByfXuRj7s9CskyCbLv/1IjqzJmXwFXWr0ov6jBV7Qbc0hh9nHg=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
    <style>
      * {
        margin: 0px;
        padding: 0px;
        box-sizing: border-box;
      }
      a {
        color: inherit;
        text-decoration: none;
      }
      ul {
        list-style: none;
      }
      .wrap {
        width: 50%;
        height: 50%;
        margin: 50px auto;
        padding: 50px;
        background-color: #edebeb;
        display: flex;
        gap: 30px;
        justify-content: center;
      }
      ul {
        overflow: hidden;
        position: relative;
      }
      li {
        border-radius: 50px;
        padding: 10px 20px;
        transition: 0.5s;
      }
      .front {
        color: #fff;
        background-color: #463429;
        position: absolute;
      }
      .back {
        background-color: #ffffff;
      }
      .right .front {
        color: #463429;
        background-color: #fff;
        position: absolute;
      }
      .right .back {
        color: #fff;
        background-color: #463429;
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <ul class="left">
        <li class="front">INQUIRE</li>
        <li class="back">INQUIRE</li>
      </ul>
      <ul class="right">
        <li class="front">VIEW SERVICE</li>
        <li class="back">VIEW SERVICE</li>
      </ul>
    </div>
    <script>
      $("ul").on("mouseenter", function () {
        // $(this).children(".front").stop().slideUp();
        $(this).children(".front").stop().animate({ top: "-100px" });
      });
      $("ul").on("mouseleave", function () {
        // $(this).children(".front").stop().slideDown();
        $(this).children(".front").stop().animate({ top: "0px" });
      });
    </script>
  </body>
</html>
