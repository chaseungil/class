<!doctype html>
<html lang="kr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <script src="js/jquery-4.0.0.min.js"></script>
    <style>
      * {
        margin: 0px;
        padding: 0px;
        box-sizing: border-box;
        word-break: keep-all;
      }
      a {
        color: inherit;
        text-decoration: none;
      }
      ul {
        list-style: none;
      }
      ul {
        background-color: blanchedalmond;
        width: 500px;
        margin: 50px auto;
        padding: 50px;
        display: flex;
        gap: 10px;
      }
      li {
        width: calc(100% / 4);
        height: 50px;
        text-align: center;
        border: 1px solid #ccc;
        /* background-color: brown; */
        border-radius: 50px;
        position: relative;
        overflow: hidden;
      }
      a {
        width: 100%;
        height: 100%;
        display: inline-block;
        line-height: 50px;
        position: absolute;
        top: 0px;
        left: 0px;
        z-index: 2;
      }
      a::after {
        content: "";
        width: 100%;
        height: 100%;
        display: inline-block;
        background-color: red;
        transform: translateX(150%);
        transition: 1s;
        position: absolute;
        top: 0px;
        left: 0px;
        z-index: -1;
      }
      li:nth-of-type(2) a::after {
        transform: translateY(150%);
      }
      li:nth-of-type(3) a::after {
        transform: translateX(-150%);
      }
      li:nth-of-type(4) a::after {
        transform: translateY(-150%);
      }
      li.active a::after {
        transform: translate(0);
      }
    </style>
  </head>
  <body>
    <ul>
      <li><a href="#">버튼1</a></li>
      <li><a href="#">버튼2</a></li>
      <li><a href="#">버튼3</a></li>
      <li><a href="#">버튼4</a></li>
    </ul>
    <script>
      $("li").on("mouseenter", function () {
        $(this).stop().addClass("active");
      });
      $("li").on("mouseleave", function () {
        $(this).stop().removeClass("active");
      });
    </script>
  </body>
</html>
