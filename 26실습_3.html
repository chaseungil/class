<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <script src="js/jquery-4.0.0.min.js"></script>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.css"
      integrity="sha512-x9WwyMYBnlXMNQ6kQ/Lyzu1NqIhLQKL5Oq6xByfXuRj7s9CskyCbLv/1IjqzJmXwFXWr0ov6jBV7Qbc0hh9nHg=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
    <style>
      * {
        margin: 0px;
        padding: 0px;
        box-sizing: border-box;
      }
      a {
        color: inherit;
        text-decoration: none;
      }
      ul {
        list-style: none;
      }
      ul {
        width: 50%;
        margin: 50px auto;
        display: flex;
        gap: 10px;
      }
      li {
        position: relative;
        border: 1px solid #000;
        border-radius: 50px;
        overflow: hidden;
      }
      a {
        width: 100%;
        height: 100%;
        padding: 10px 20px;
        display: inline-block;
      }
      a::before {
        content: "";
        width: 100%;
        height: 100%;
        background-color: blueviolet;
        position: absolute;
        top: 0px;
        left: 0px;
        transform: translateX(150%);
        transition: 0.5s;
        z-index: -1;
      }
      li:nth-of-type(2) a::before {
        transform: translateX(-150%);
      }
      li:nth-of-type(3) a::before {
        transform: translateY(150%);
      }
      li:nth-of-type(4) a::before {
        transform: translateX(-150%);
      }
      li.active a::before {
        transform: translate(0);
      }
    </style>
  </head>
  <body>
    <ul>
      <li><a href="#">버튼1</a></li>
      <li><a href="#">버튼2</a></li>
      <li><a href="#">버튼3</a></li>
      <li><a href="#">버튼4</a></li>
    </ul>
    <script>
      $("li").on("mouseenter", function () {
        $(this).addClass("active");
      });
      $("li").on("mouseleave", function () {
        $(this).removeClass("active");
      });
    </script>
  </body>
</html>
