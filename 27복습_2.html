<!doctype html>
<html lang="kr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <script src="js/jquery-4.0.0.min.js"></script>
    <style>
      * {
        margin: 0px;
        padding: 0px;
      }
      a {
        color: inherit;
        text-decoration: none;
      }
      ul {
        list-style: none;
      }
      ul {
        background-color: #555;
        width: 1000px;
        margin: 50px auto;
        display: flex;
        justify-content: space-around;
        padding: 50px;
        li {
          background-color: brown;
          border-radius: 30px;
          position: relative;
          overflow: hidden;
          a {
            display: inline-block;
            padding: 10px 20px;
            position: relative;
            color: #fff;
            z-index: 10;
            transition: 1s;
          }
          div {
            width: 100%;
            height: 50px;
            background-color: gold;
            position: absolute;
            top: -150%;
            left: 0px;
            transition: 1s;
          }
        }
        li:nth-of-type(2) div {
          top: 150%;
        }
        li:nth-of-type(3) div {
          top: 0px;
          left: 150%;
        }
        li:nth-of-type(4) div {
          top: 0px;
          left: -150%;
        }
        li div.on {
          top: 0px;
          left: 0px;
        }
        li a.on2 {
          color: #000;
        }
      }
    </style>
  </head>
  <body>
    <ul>
      <li>
        <a href="#">ABOUT</a>
        <div></div>
      </li>
      <li>
        <a href="#">처음오신분</a>
        <div></div>
      </li>
      <li>
        <a href="#">이벤트</a>
        <div></div>
      </li>
      <li>
        <a href="#">CONTACT US</a>
        <div></div>
      </li>
    </ul>
    <script>
      $("li").on("mouseenter", function () {
        $(this).find("div").stop().addClass("on");
        $(this).find("a").stop().addClass("on2");
      });
      $("li").on("mouseleave", function () {
        $(this).find("div").stop().removeClass("on");
        $(this).find("a").stop().removeClass("on2");
      });
    </script>
  </body>
</html>
