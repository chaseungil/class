<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <script src="js/jquery-4.0.0.min.js"></script>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.css"
      integrity="sha512-x9WwyMYBnlXMNQ6kQ/Lyzu1NqIhLQKL5Oq6xByfXuRj7s9CskyCbLv/1IjqzJmXwFXWr0ov6jBV7Qbc0hh9nHg=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
    <style>
      * {
        margin: 0px;
        padding: 0px;
        box-sizing: border-box;
      }
      a {
        color: inherit;
        text-decoration: none;
      }
      ul {
        list-style: none;
      }
    </style>
  </head>
  <body>
    <ul>
      <li>list01</li>
      <li>list02</li>
      <li>list03</li>
      <li>list04</li>
    </ul>
    <script>
      $("li").on("click", function () {
        i = $(this).index(); // 클릭한 li의 순번을 i라는 변수에 넣어라
        console.log(i); // 콘솔창에 i변수에 있는 값을 출력해라
      });
    </script>
  </body>
</html>

<!--
index() :: 선택한 요소가  몇번째인지 자리수 번호를 가르쳐 줌
번호는 0부터 시작함

html은 순번이 1부터 시작함
제이쿼리, 자바스크립트는 0부터 시작
-->
