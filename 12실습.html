<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <script src="js/jquery-4.0.0.min.js"></script>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.css"
      integrity="sha512-x9WwyMYBnlXMNQ6kQ/Lyzu1NqIhLQKL5Oq6xByfXuRj7s9CskyCbLv/1IjqzJmXwFXWr0ov6jBV7Qbc0hh9nHg=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
    <style>
      * {
        margin: 0px;
        padding: 0px;
        box-sizing: border-box;
      }
      a {
        color: inherit;
        text-decoration: none;
      }
      ul {
        list-style: none;
      }
      #wrap01 {
        width: 1200px;
        margin: 50px auto;
        h2 {
          font-size: 1.8rem;
        }
      }
      #wrap01 ul {
        width: 100%;
        margin: 50px 0px;
        display: flex;
        gap: 20px;
        justify-content: center;
      }
      #wrap01 ul li {
        width: 50%;
        height: 300px;
        border-radius: 20px;
        transition: 1s;
        color: #fff;
        position: relative;
        img {
          width: 100%;
          height: 100%;
          object-fit: cover;
          filter: brightness(50%);
          border-radius: 20px;
        }
      }
      /* #wrap01 ul .left {
        background-image: url(img/sec1_bg1.png);
        background-repeat: no-repeat;
        background-size: cover;
        background-position: center;
      }
      #wrap01 ul .right {
        background-image: url(img/sec1_bg2.jpg);
        background-repeat: no-repeat;
        background-size: cover;
        background-position: center;
      } */
      #wrap01 .txt {
        position: absolute;
        bottom: 50px;
        left: 50px;
        h3 {
          font-size: 1.5rem;
        }
        p {
          font-size: 0.8rem;
          margin: 20px 0px 40px;
        }
        a {
          width: 150px;
          border: 1px solid #fff;
          border-radius: 10px;
          padding: 10px;
        }
      }
    </style>
  </head>
  <body>
    <section id="wrap01">
      <h2>
        삼성에피스홀딩스는 혁신적인 연구 역량과 미래 기술을 향한 도전으로
        바이오의약품 시장의 새로운 역사를 만들어갑니다.
      </h2>
      <ul>
        <li class="left">
          <img src="img/sec1_bg1.png" />
          <div class="txt">
            <h3>회사소개</h3>
            <p>
              삼성에피스홀딩스는 투명하고 효율적인 경영을 통해 바이오의약품
              시장을 선도하겠습니다.
            </p>
            <a href="#">자세히 보기 -></a>
          </div>
        </li>
        <li class="right">
          <img src="img/sec1_bg2.jpg" />
          <div class="txt">
            <h3>자회사 소개</h3>
            <p>
              삼성에피스홀딩스는 삼성바이오에피스와 에피스넥스랩을 자회사로
              보유하고 있습니다.
            </p>
            <a href="#">자세히 보기 -></a>
          </div>
        </li>
      </ul>
      <script>
        $("#wrap01 li").on("mouseenter", function () {
          $(this).css({ width: "70%" });
          $(this)
            .children("div")
            .children("a")
            .css({ "background-color": "#fff" });
          $(this).children("div").children("a").css({ color: "#000" });
        });
        $("#wrap01 li").on("mouseleave", function () {
          $(this).css({ width: "50%" });
          $(this)
            .children("div")
            .children("a")
            .css({ "background-color": "rgba(255,255,255,0)" });
          $(this).children("div").children("a").css({ color: "#fff" });
        });
      </script>
    </section>
  </body>
</html>
