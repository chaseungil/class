<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <script src="js/jquery-4.0.0.min.js"></script>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.css"
      integrity="sha512-x9WwyMYBnlXMNQ6kQ/Lyzu1NqIhLQKL5Oq6xByfXuRj7s9CskyCbLv/1IjqzJmXwFXWr0ov6jBV7Qbc0hh9nHg=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
    <style>
      * {
        margin: 0px;
        padding: 0px;
        box-sizing: border-box;
      }
      a {
        color: inherit;
        text-decoration: none;
      }
      ul {
        list-style: none;
      }

      #wrap01 {
        width: 1000px;
        margin: 50px auto;
        display: flex;
        gap: 50px;
        justify-content: center;
        align-items: center;
        padding: 20px;
        .left {
          width: 60%;
        }
      }
      .left li {
        display: none;
        img {
          width: 100%;
          border-radius: 30px;
        }
      }
      .left li:nth-of-type(1) {
        display: block;
      }
      .right li {
        font-size: 2.5rem;
        line-height: 8rem;
        cursor: pointer;
        border-top: 1px solid #ccc;
        border-bottom: 1px solid transparent;
      }
      .right li:nth-of-type(4) {
        border-bottom: 1px solid #ccc;
      }
      #wrap01 .on {
        display: block;
      }
    </style>
  </head>
  <body>
    <section id="wrap01">
      <ul class="left">
        <li><img src="img/092105.png" alt="" /></li>
        <li><img src="img/092106.png" alt="" /></li>
        <li><img src="img/092107.png" alt="" /></li>
        <li><img src="img/092108.png" alt="" /></li>
      </ul>
      <ul class="right">
        <li>Security</li>
        <li>Logistics</li>
        <li>Manufacturing</li>
        <li>Data Center</li>
      </ul>
    </section>
    <script>
      $(".right li").on("click", function () {
        i = $(this).index();
        $(".left li").hide();
        $(".left li").eq(i).show();
      });
    </script>
  </body>
</html>
