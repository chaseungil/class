<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <script src="js/jquery-4.0.0.min.js"></script>
    <style>
      * {
        margin: 0px;
        padding: 0px;
        box-sizing: border-box;
        word-break: keep-all;
      }
      ul {
        list-style: none;
      }
      a {
        color: inherit;
        text-decoration: none;
      }

      ul {
        display: flex;
        gap: 10px;
        justify-content: center;
        margin: 30px 0px;
      }
      li {
        width: 150px;
        height: 50px;
        border: 1px solid #ccc;
        border-radius: 50px;
        text-align: center;
        line-height: 50px;
        overflow: hidden;
        position: relative;
      }
      a {
        width: 100%;
        height: 100%;
        display: inline-block;
      }
      a::before {
        content: "";
        background-color: red;
        width: 100%;
        height: 100%;
        display: inline-block;
        transform: translateX(100%);
        transition: 0.5s;
        position: absolute;
        left: 0px;
        top: 0px;
        z-index: -1;
      }
      li.active a::before {
        transform: translateX(0);
      }
      .wrap02 a::before {
        transform: translateX(-100%);
      }
      .wrap03 a::before {
        transform: translateY(100%);
      }
      .wrap04 a::before {
        transform: translateY(-100%);
      }
    </style>
  </head>
  <body>
    <ul>
      <li><a href="#">버튼1</a></li>
      <li><a href="#">버튼2</a></li>
    </ul>
    <ul class="wrap02">
      <li><a href="#">버튼1</a></li>
      <li><a href="#">버튼2</a></li>
    </ul>
    <ul class="wrap03">
      <li><a href="#">버튼1</a></li>
      <li><a href="#">버튼2</a></li>
    </ul>
    <ul class="wrap04">
      <li><a href="#">버튼1</a></li>
      <li><a href="#">버튼2</a></li>
    </ul>
    <script>
      $("li").on("mouseenter", function () {
        $(this).addClass("active");
      });
      $("li").on("mouseleave", function () {
        $(this).removeClass("active");
      });
    </script>
  </body>
</html>
