<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <script src="js/jquery-4.0.0.min.js"></script>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.css"
      integrity="sha512-x9WwyMYBnlXMNQ6kQ/Lyzu1NqIhLQKL5Oq6xByfXuRj7s9CskyCbLv/1IjqzJmXwFXWr0ov6jBV7Qbc0hh9nHg=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
    <style>
      * {
        margin: 0px;
        padding: 0px;
        /* box-sizing: border-box; */
      }
      a {
        color: inherit;
        text-decoration: none;
      }
      ul {
        list-style: none;
      }

      #wrap01 {
        width: 1000px;
        margin: 50px auto;
        text-align: center;
      }
      .wrap01_up {
        width: 100%;
      }
      .wrap01_up li {
        width: 100%;
        display: none;
        img {
          width: 100%;
        }
      }
      .wrap01_up .pic01 {
        display: block;
      }
      .wrap01_down {
        width: 500px;
        margin: 50px auto;
        display: flex;
        gap: 20px;
      }
      .wrap01_down li {
        width: 20%;
        cursor: pointer;
        border-radius: 30px;
        border: 5px solid transparent;
        img {
          width: 100%;
          border-radius: 30px;
          display: block;
        }
      }
      #wrap01 .on {
        border: 5px solid #000;
      }
    </style>
  </head>
  <body>
    <section id="wrap01">
      <ul class="wrap01_up">
        <li class="pic01"><img src="img/092101.jpg" alt="" /></li>
        <li class="pic02"><img src="img/092102.jpg" alt="" /></li>
        <li class="pic03"><img src="img/092103.jpg" alt="" /></li>
        <li class="pic04"><img src="img/092104.jpg" alt="" /></li>
        <li class="pic05"><img src="img/092105.jpg" alt="" /></li>
      </ul>
      <ul class="wrap01_down">
        <li class="pic01"><img src="img/092101.jpg" alt="" /></li>
        <li class="pic02"><img src="img/092102.jpg" alt="" /></li>
        <li class="pic03"><img src="img/092103.jpg" alt="" /></li>
        <li class="pic04"><img src="img/092104.jpg" alt="" /></li>
        <li class="pic05"><img src="img/092105.jpg" alt="" /></li>
      </ul>
      <script>
        $(".wrap01_down .pic01").on("click", function () {
          $(".wrap01_up li").hide();
          $(".wrap01_up .pic01").show();
          $(".wrap01_down li").removeClass("on");
          $(this).addClass("on");
        });
        $(".wrap01_down .pic02").on("click", function () {
          $(".wrap01_up li").hide();
          $(".wrap01_up .pic02").show();
          $(".wrap01_down li").removeClass("on");
          $(this).addClass("on");
        });
        $(".wrap01_down .pic03").on("click", function () {
          $(".wrap01_up li").hide();
          $(".wrap01_up .pic03").show();
          $(".wrap01_down li").removeClass("on");
          $(this).addClass("on");
        });
        $(".wrap01_down .pic04").on("click", function () {
          $(".wrap01_up li").hide();
          $(".wrap01_up .pic04").show();
          $(".wrap01_down li").removeClass("on");
          $(this).addClass("on");
        });
        $(".wrap01_down .pic05").on("click", function () {
          $(".wrap01_up li").hide();
          $(".wrap01_up .pic05").show();
          $(".wrap01_down li").removeClass("on");
          $(this).addClass("on");
        });
      </script>
    </section>
  </body>
</html>
