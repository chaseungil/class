<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <script src="js/jquery-4.0.0.min.js"></script>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.css"
      integrity="sha512-x9WwyMYBnlXMNQ6kQ/Lyzu1NqIhLQKL5Oq6xByfXuRj7s9CskyCbLv/1IjqzJmXwFXWr0ov6jBV7Qbc0hh9nHg=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
    <style>
      * {
        margin: 0px;
        padding: 0px;
        box-sizing: border-box;
      }
      a {
        color: inherit;
        text-decoration: none;
      }
      ul {
        list-style: none;
      }

      div {
        width: 50%;
        height: 100px;
        background-color: #ccc;
        margin: 50px auto;
      }
      .init {
        color: #000;
        background-color: #ccc;
        border: none;
        width: 50%;
        height: 100px;
        transform: scale(1);
      }
    </style>
  </head>
  <body>
    <div>박스</div>
    <button class="btn01">글자색</button>
    <button class="btn02">배경색</button>
    <button class="btn03">테두리</button>
    <button class="btn04">너비</button>
    <button class="btn05">높이</button>
    <button class="btn06">크기</button>
    <button class="btn07">초기화</button>
    <script>
      $(".btn01").on("click", function () {
        $("div").css({ color: "red" });
      });
      $(".btn02").on("click", function () {
        $("div").css({ "background-color": "#000" });
      });
      $(".btn03").on("click", function () {
        $("div").css({ border: "1px, solid red" });
      });
      $(".btn04").on("click", function () {
        $("div").css({ width: "100%" });
      });
      $(".btn05").on("click", function () {
        $("div").css({ height: "200px" });
      });
      $(".btn06").on("click", function () {
        $("div").css({ transform: "scale(1.5)" });
      });
      // $(".btn07").on("click", function () {
      //   $("div").css({
      //     color: "#000",
      //     "background-color": "#ccc",
      //     border: "none",
      //     width: "50%",
      //     height: "100px",
      //     transform: "scale(1)",
      //   });
      // });
      $(".btn07").on("click", function () {
        $("div").addClass("init");
      });
    </script>
  </body>
</html>
